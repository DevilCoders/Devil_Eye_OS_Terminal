name: Engineering taxonomy and issue automation

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/engineering-taxonomy.yml"
  issues:
    types: [opened, reopened, closed]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-metadata-reconciliation
  cancel-in-progress: false

jobs:
  provision-and-classify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Create and verify taxonomy, milestones, and issue metadata
        uses: actions/github-script@v7
        with:
          script: |
            const { resolveMilestoneTitle } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/taxonomy-milestone.cjs`);

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Keep this catalog unique. GitHub label names are unique within
            // a repository; existing labels are verified and reconciled.
            const labels = [
              ["type:epic", "1D4ED8", "Major engineering outcome"],
              ["type:task", "2563EB", "Implementation task"],
              ["type:bug", "B91C1C", "Defect"],
              ["type:spike", "7C3AED", "Time-boxed research"],
              ["priority:P0", "991B1B", "Critical path / release blocker"],
              ["priority:P1", "C2410C", "High priority"],
              ["priority:P2", "A16207", "Normal priority"],
              ["priority:P3", "64748B", "Low priority"],
              ["status:planned", "64748B", "Not yet ready to start"],
              ["status:todo", "64748B", "Ready for implementation"],
              ["status:in-progress", "2563EB", "Actively being implemented"],
              ["status:blocked", "B91C1C", "Blocked by dependency or decision"],
              ["status:review", "7C3AED", "Awaiting review or validation"],
              ["status:done", "15803D", "Completed and verified"],
              ["component:build", "0F766E", "Build system and developer tooling"],
              ["component:architecture", "0F766E", "System architecture and API contracts"],
              ["component:rust", "0F766E", "Rust application and crates"],
              ["component:c-shell", "0F766E", "DE-Shell C implementation"],
              ["component:terminal-engine", "0F766E", "VT/ANSI and screen model"],
              ["component:pty", "0F766E", "PTY and process I/O"],
              ["component:runtime", "0F766E", "DE-Runtime and OS adapters"],
              ["component:ipc-ffi", "0F766E", "Rust-C ABI and IPC"],
              ["component:renderer", "0F766E", "Terminal rendering"],
              ["component:gui", "0F766E", "Desktop GUI and interaction"],
              ["component:security", "0F766E", "Security engineering"],
              ["component:testing", "0F766E", "Testing and QA"],
              ["component:docs", "0F766E", "Documentation and governance"],
              ["component:release", "0F766E", "Packaging and release"],
              ["component:platform", "0F766E", "Cross-platform support"],
              ["component:session", "0F766E", "Sessions and workspaces"],
              ["component:config", "0F766E", "Configuration and persistence"],
              ["component:plugins", "0F766E", "Plugin system"],
              ["component:productivity", "0F766E", "Productivity features"],
              ["component:performance", "0F766E", "Performance engineering"],
              ["platform:linux", "0369A1", "Linux x86_64 target"],
              ["platform:windows", "0369A1", "Windows target"],
              ["platform:macos", "0369A1", "macOS target"]
            ];

            for (const [name, color, description] of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner, repo, name, color, description
                });
              } catch (error) {
                if (error.status !== 422) throw error;

                // A 422 is ignored only when the named label can be fetched.
                // Existing metadata is reconciled to this source of truth.
                const existing = await github.rest.issues.getLabel({
                  owner, repo, name
                });
                if (
                  existing.data.color !== color ||
                  existing.data.description !== description
                ) {
                  await github.rest.issues.updateLabel({
                    owner, repo, name, color, description
                  });
                }
              }
            }

            const milestones = [
              ["M0 Engineering Foundation", "Repository, toolchain, architecture, build and CI foundations."],
              ["M1 Shell Alpha", "Initial C shell core and command registry."],
              ["M2 Runtime Alpha", "Runtime contract and first platform implementation."],
              ["M3 Terminal Engine Alpha", "Screen model and terminal state engine."],
              ["M4 PTY Alpha", "Interactive process I/O and lifecycle."],
              ["M5 Communication Alpha", "Rust-C IPC/FFI integration."],
              ["M6 Terminal GUI Alpha", "Renderer, input, and initial GUI."],
              ["M7 Integrated Beta", "Shell language, sessions, configuration, and end-to-end integration."],
              ["M8 Feature Complete", "Productivity, plugin architecture, performance, and platform expansion."],
              ["M9 Release Candidate", "Security, documentation, packaging, and release qualification."],
              ["M10 Production 1.0", "Production release and maintenance handoff."]
            ];

            const existingMilestones = await github.paginate(
              github.rest.issues.listMilestones,
              { owner, repo, state: "all", per_page: 100 }
            );
            const milestoneByTitle = new Map(
              existingMilestones.map(m => [m.title, m.number])
            );

            for (const [title, description] of milestones) {
              if (!milestoneByTitle.has(title)) {
                const created = await github.rest.issues.createMilestone({
                  owner, repo, title, description, state: "open"
                });
                milestoneByTitle.set(title, created.data.number);
              }
            }

            const allIssues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: "all", per_page: 100 }
            );
            const repositoryIssues = allIssues.filter(issue => !issue.pull_request);
            const openIssueNumbers = new Set(
              repositoryIssues
                .filter(issue => issue.state === "open")
                .map(issue => issue.number)
            );

            const componentRules = [
              [/DE-001/, "component:build"],
              [/DE-002/, "component:architecture"],
              [/DE-003/, "component:rust"],
              [/DE-004|DE-012|DE-013/, "component:c-shell"],
              [/DE-005/, "component:terminal-engine"],
              [/DE-006/, "component:pty"],
              [/DE-007/, "component:runtime"],
              [/DE-008/, "component:ipc-ffi"],
              [/DE-009/, "component:renderer"],
              [/DE-010|DE-011/, "component:gui"],
              [/DE-014/, "component:session"],
              [/DE-015/, "component:config"],
              [/DE-016/, "component:security"],
              [/DE-017/, "component:plugins"],
              [/DE-018/, "component:productivity"],
              [/DE-019/, "component:testing"],
              [/DE-020/, "component:performance"],
              [/DE-021/, "component:platform"],
              [/DE-022/, "component:docs"],
              [/DE-023|DE-024/, "component:release"]
            ];

            const epicMilestones = {
              "DE-001": "M0 Engineering Foundation",
              "DE-002": "M0 Engineering Foundation",
              "DE-003": "M0 Engineering Foundation",
              "DE-004": "M1 Shell Alpha",
              "DE-013": "M1 Shell Alpha",
              "DE-007": "M2 Runtime Alpha",
              "DE-005": "M3 Terminal Engine Alpha",
              "DE-006": "M4 PTY Alpha",
              "DE-008": "M5 Communication Alpha",
              "DE-009": "M6 Terminal GUI Alpha",
              "DE-010": "M6 Terminal GUI Alpha",
              "DE-011": "M6 Terminal GUI Alpha",
              "DE-012": "M7 Integrated Beta",
              "DE-014": "M7 Integrated Beta",
              "DE-015": "M7 Integrated Beta",
              "DE-017": "M8 Feature Complete",
              "DE-018": "M8 Feature Complete",
              "DE-020": "M8 Feature Complete",
              "DE-021": "M8 Feature Complete",
              "DE-016": "M9 Release Candidate",
              "DE-022": "M9 Release Candidate",
              "DE-023": "M9 Release Candidate",
              "DE-024": "M10 Production 1.0"
            };

            const taxonomyPrefixes = [
              "type:", "priority:", "status:", "component:", "platform:"
            ];

            for (const issue of repositoryIssues) {
              const issueText = (issue.title || "") + "\n" + (issue.body || "");
              const current = new Set(
                (issue.labels || []).map(label =>
                  typeof label === "string" ? label : label.name
                )
              );
              const wanted = new Set();
              const idMatch = issue.title.match(/DE-\d{3}/);
              const epicId = idMatch ? idMatch[0] : null;

              if (/^\[EPIC\]/i.test(issue.title)) wanted.add("type:epic");
              else if (/^\[TASK\]/i.test(issue.title)) wanted.add("type:task");
              else if (/^\[BUG\]/i.test(issue.title)) wanted.add("type:bug");
              else if (/^\[SPIKE\]/i.test(issue.title)) wanted.add("type:spike");

              const priority = issueText.match(/Priority:\*{0,2}\s*(P[0-3])/i);
              if (priority) wanted.add("priority:" + priority[1].toUpperCase());

              if (epicId) {
                for (const [pattern, label] of componentRules) {
                  if (pattern.test(epicId)) {
                    wanted.add(label);
                    break;
                  }
                }
              }

              const platform = issueText.match(/Platform:\*{0,2}\s*([^\r\n]+)/i);
              if (platform) {
                const value = platform[1].toLowerCase();
                if (value.includes("linux")) wanted.add("platform:linux");
                if (value.includes("windows")) wanted.add("platform:windows");
                if (value.includes("macos") || value.includes("mac os")) {
                  wanted.add("platform:macos");
                }
              }

              let desiredStatus = null;
              if (issue.state === "closed") {
                desiredStatus = "status:done";
              } else if (/^\[EPIC\]/i.test(issue.title)) {
                desiredStatus = "status:planned";
              } else if (/^\[TASK\]/i.test(issue.title)) {
                const dependencySection = (issue.body || "").match(
                  /### Dependencies\s*([\s\S]*?)(?:\n###|$)/i
                );
                const dependencyNumbers = dependencySection
                  ? [...dependencySection[1].matchAll(/#(\d+)/g)]
                      .map(match => Number(match[1]))
                  : [];
                const blocked = dependencyNumbers.some(number =>
                  openIssueNumbers.has(number)
                );
                const protectedStatus = ["status:in-progress", "status:review"]
                  .find(status => current.has(status));

                desiredStatus = protectedStatus ||
                  (blocked ? "status:blocked" : "status:todo");
              }

              if (desiredStatus) wanted.add(desiredStatus);

              const target = issueText.match(
                /Target milestone:\*{0,2}\s*([^\r\n]+)/i
              );
              const rawMilestoneTarget = target ? target[1].trim() : null;
              const milestoneTitle = resolveMilestoneTitle(
                rawMilestoneTarget,
                epicId,
                milestones.map(([title]) => title),
                epicMilestones
              );
              if (milestoneTitle) {
                const number = milestoneByTitle.get(milestoneTitle);
                if (number && (!issue.milestone || issue.milestone.number !== number)) {
                  await github.rest.issues.update({
                    owner, repo, issue_number: issue.number, milestone: number
                  });
                }
              }

              const staleTaxonomy = [...current].filter(label =>
                taxonomyPrefixes.some(prefix => label.startsWith(prefix)) &&
                !wanted.has(label)
              );
              for (const label of staleTaxonomy) {
                try {
                  await github.rest.issues.removeLabel({
                    owner, repo, issue_number: issue.number, name: label
                  });
                } catch (error) {
                  // The dependency reconciler may have removed this label
                  // between the issue snapshot and this request.
                  if (error.status !== 404) throw error;
                }
              }

              const missingTaxonomy = [...wanted].filter(label => !current.has(label));
              if (missingTaxonomy.length) {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: issue.number, labels: missingTaxonomy
                });
              }
            }

            core.info(
              `Verified ${labels.length} unique taxonomy labels and ${milestones.length} milestones; reconciled metadata for ${repositoryIssues.length} issues (${openIssueNumbers.size} open).`
            );
