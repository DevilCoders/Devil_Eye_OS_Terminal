name: Rust CI

# Workspace checks include terminal-core renderer modules and headless golden tests.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "src/**"
      - ".github/workflows/rust-ci.yml"
  push:
    branches:
      - master
      - "feat/**"
      - "test/**"
      - "build/**"
      - "docs/**"
      - "perf/**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "src/**"
      - ".github/workflows/rust-ci.yml"

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, test, and lint (Linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Report toolchain versions
        run: |
          rustc --version
          cargo --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run workspace tests
        run: cargo test --workspace --all-targets

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install pinned coverage tool
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked

      - name: Generate Rust coverage report
        run: |
          mkdir -p target/coverage
          cargo llvm-cov --workspace --lcov --output-path target/coverage/rust.lcov

      - name: Upload Rust coverage report
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: target/coverage/rust.lcov
          if-no-files-found: error
