name: Dependency-aware issue status

on:
  workflow_dispatch:
  issues:
    types: [opened, reopened, closed]

permissions:
  contents: read
  issues: write

concurrency:
  group: dependency-status
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile blocked and ready task labels
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const allOpen = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100
            });
            const openNumbers = new Set(allOpen.filter(i => !i.pull_request).map(i => i.number));

            for (const issue of allOpen) {
              if (issue.pull_request || !/^\[TASK\]/i.test(issue.title)) continue;
              const section = (issue.body || "").match(/### Dependencies\s*([\s\S]*?)(?:\n###|$)/i);
              const refs = section ? [...section[1].matchAll(/#(\d+)/g)].map(m => Number(m[1])) : [];
              const blocked = refs.some(number => openNumbers.has(number));
              const current = new Set((issue.labels || []).map(label => typeof label === "string" ? label : label.name));
              const protectedStatuses = ["status:in-progress", "status:review", "status:done"];
              if (protectedStatuses.some(label => current.has(label))) continue;

              if (blocked) {
                if (current.has("status:todo")) {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: "status:todo" });
                }
                if (!current.has("status:blocked")) {
                  await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ["status:blocked"] });
                }
              } else {
                if (current.has("status:blocked")) {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: "status:blocked" });
                }
                if (!current.has("status:todo")) {
                  await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ["status:todo"] });
                }
              }
            }

            core.info(`Reconciled dependency status for ${allOpen.length} open repository issues.`);
