name: Dependency-aware issue status

on:
  workflow_dispatch:
  issues:
    types: [opened, reopened, closed, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: dependency-status
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Reconcile blocked and ready task labels
        uses: actions/github-script@v7
        with:
          script: |
            const {
              chooseTaskStatus,
              reconcileStatusLabels,
            } = require("./.github/scripts/dependency-status.cjs");

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const allOpen = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: "open", per_page: 100 }
            );
            const openIssueNumbers = new Set(
              allOpen
                .filter(issue => !issue.pull_request)
                .map(issue => issue.number)
            );

            let taskCount = 0;
            let changedCount = 0;

            for (const issue of allOpen) {
              if (issue.pull_request || !/^\[TASK\]/i.test(issue.title)) continue;
              taskCount += 1;

              const currentLabels = (issue.labels || []).map(label =>
                typeof label === "string" ? label : label.name
              );
              const desiredStatus = chooseTaskStatus({
                body: issue.body || "",
                currentLabels,
                openIssueNumbers,
              });
              const changes = reconcileStatusLabels(
                currentLabels,
                desiredStatus
              );

              for (const label of changes.remove) {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: issue.number, name: label
                });
              }

              if (changes.add.length) {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: issue.number, labels: changes.add
                });
              }

              if (changes.remove.length || changes.add.length) {
                changedCount += 1;
              }
            }

            core.info(
              `Reconciled dependency status for ${taskCount} open Tasks; changed ${changedCount}.`
            );
